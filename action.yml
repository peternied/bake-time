name: Bake Time
description: "DEPRECATED: This action has been decommissioned and no longer works on GitHub Actions"

branding:
  icon: 'watch'
  color: 'green'

inputs:
  delay-hours:
    description: How many hours before pull requests have finished baking
    default: 24
    required: false
  ignore-non-push-updates:
    description: Controls if the bake timer uses the last update to the PR like approvals or the just the last push to calculate the remaining time
    default: "true"
    required: false
  check-name:
    description: The name of the check that is used to block baking pull requests, recommend "Baking pull request..."
    required: true

runs:
  using: "composite"
  steps:
  - name: Deprecated action
    shell: bash
    run: |
      echo "::error title=Deprecated action::peternied/bake-time has been decommissioned because GitHub no longer allows this workflow design to update Actions-created check runs with GITHUB_TOKEN. Remove this action from your workflows."
      exit 1
